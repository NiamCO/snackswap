<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fullscreen Iframe with Shielded Popup</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
    }

    /* YOUR POPUP (unchanged except earlier width increase) */
    .macvg-popup {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 8px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* SHIELD: EXACT SAME SIZE AS POPUP */
    .click-shield {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 2147483646; /* right under your popup */
      background: transparent;
      pointer-events: auto;

      /* Match popup size exactly */
      padding: 12px 24px;
      font-size: 13px;
      border-radius: 8px;

      /* Needed to match the popup's text height */
      display: inline-block;
      height: calc(13px + 24px); /* text height + vertical padding */
      width: auto;
    }
  </style>
</head>
<body>

  <iframe src="https://snackswap.base44.app"></iframe>

  <!-- Shield goes under your popup -->
  <div class="click-shield"></div>

  <!-- Your popup -->
  <div class="macvg-popup">
    from the creator of MacVG
  </div>

</body>
</html>
