<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SnackSwap</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Fullscreen iframe */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;

      /* Prevent iframe from ever stacking above overlays */
      z-index: 1;
    }

    /* Popup that MUST stay on top */
    .macvg-popup {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 2147483647; /* Max safe integer for z-index */
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Replace with your real URL -->
  <iframe src="https://example.com"></iframe>

  <div class="macvg-popup">
    from the creator of MacVG
  </div>

</body>
</html>
