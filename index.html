<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fullscreen Iframe with Persistent Popup</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Fullscreen iframe */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* Persistent bottom-right popup */
    .macvg-popup {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      pointer-events: none; /* so it doesn't interfere with clicks on the page */
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- Replace the src with your SnackSwap/Base44 page URL -->
  <iframe src="https://example.com"></iframe>

  <div class="macvg-popup">
    from the creator of MacVG
  </div>
</body>
</html>
