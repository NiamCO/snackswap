<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SnackSwap Embed</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
  }

  iframe {
    width: 100vw;
    height: 100vh;
    border: none;
  }

  /* Popup that covers the Base44 popup */
  .creator-popup {
    position: fixed;
    bottom: 10px;
    right: 10px;

    /* Larger than the Base44 popup so it fully covers it */
    width: 220px;
    padding: 16px;

    background: rgba(0,0,0,0.85);
    color: white;
    border-radius: 12px;

    font-size: 15px;
    font-weight: 500;

    display: flex;
    align-items: center;
    gap: 10px;

    box-shadow: 0 4px 14px rgba(0,0,0,0.35);

    /* Never disappears */
    z-index: 999999;
  }

  .creator-popup .icon {
    font-size: 22px;
  }
</style>
</head>
<body>

<iframe src="https://snackswap.base44.app"></iframe>

<div class="creator-popup">
  <span class="icon">🎮</span>
  From the creator of <strong>MacVG</strong>
</div>

</body>
</html>
