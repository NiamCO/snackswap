<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fullscreen Iframe with Shielded Popup</title>

  <!-- Favicon (cookie emoji) -->
  <link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <text y='0.9em' font-size='90'>🍪</text>
    </svg>">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
    }

    /* YOUR POPUP (unchanged) */
    .macvg-popup {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 8px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* SHIELD: EXTENDED FAR LEFT */
    .click-shield {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 2147483646;
      background: transparent;
      pointer-events: auto;

      /* EXTENDED WIDTH — covers entire Base44 popup area */
      width: 360px;  /* extended a LOT to the left */
      height: calc(12px + 12px + 1.2em);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <iframe src="https://snackswap.base44.app"></iframe>

  <!-- Shield under your popup -->
  <div class="click-shield"></div>

  <!-- Your popup -->
  <div class="macvg-popup">
    from the creator of MacVG
  </div>

</body>
</html>
